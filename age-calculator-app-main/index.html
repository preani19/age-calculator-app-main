<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <!-- icon -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <!-- font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Itim&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Karla:ital,wght@0,200..800;1,200..800&family=Manrope:wght@200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
  <!-- main style -->
   <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Age calculator app</title>
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
  <script defer src="cal.js"></script>
</head>
<body>
  <div class="container">

    <div class="time">
        <form action="">
          <div class="inputh">
              <div class="input one">
                <p class="i">Day</p>
                <input  type="number" placeholder="DD" required min="1">
              </div>
              <div class="input two">
                <p>Month</p>
                <input  type="number" placeholder="MM" required min="1">
              </div>
              <div class="input three">
                <p>Year</p>
                <input class="nd" type="number" placeholder="YYYY" required >
              </div>
          </div>
          <button type="submit"><img src="assets/images/icon-arrow.svg" alt="arraow"></button>
          <hr>
        </form>
        <div class="result">
          <div class="cn">
            <p class="years">--</p><p> years</p>
          </div>
          <div class="cn">
            <p class="months">--</p><p> months</p>
          </div>
          <div class="cn">
            <p class="days">--</p><p> days</p>
          </div>
        </div>
    </div>
    
  </div>
  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </div>
</body>
</html>
